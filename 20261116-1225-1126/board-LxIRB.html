<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>App header</title>
    <style>
      body {
        margin: 0;
        background: var(--colorNeutralBackground2);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --colorNeutralBackground2: #fafafa;
      }

      .app-header {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 0 22px;
        width: 1366px;
        height: 56px;
        background-color: var(--colorNeutralBackground2);
      }

      .app-header__surya-logo {
        position: relative;
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        overflow: hidden;
      }

      .app-header__logo-crop {
        position: absolute;
        left: -20px;
        top: -12px;
        width: 1160px;
        height: 584px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <header class="app-header" data-component="app-header">
      <div class="app-header__surya-logo">
        <img class="app-header__logo-crop" src="assets/image.png" alt="Logo crop">
      </div>
    </header>
  </body>
</html>
