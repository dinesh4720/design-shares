<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>App rail</title>
    <style>
      /* The fonts ship beside the page (assets/fonts/), so text looks the same on every system. */

      /* Segoe UI from Google Fonts, under the SIL Open Font License or Apache License 2.0, https://fonts.google.com */

      @font-face {
        font-family: 'Segoe UI';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: local('Segoe UI'), url("assets/fonts/segoe-ui-600-figma.ttf") format("truetype");
        ascent-override: 107.91%;
        descent-override: 25.1%;
        line-gap-override: 0%;
      }

      @font-face {
        font-family: 'Segoe UI';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: local('Segoe UI'), url("assets/fonts/segoe-ui-400-figma.ttf") format("truetype");
        ascent-override: 107.91%;
        descent-override: 25.1%;
        line-gap-override: 0%;
      }

      body {
        margin: 0;
        background: var(--colorNeutralBackground2);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --colorNeutralForeground2: #424242;
        --colorNeutralForeground3: #616161;
        --colorNeutralBackground2: #fafafa;
        --colorNeutralBackground5: #ebebeb;
        --colorNeutralStroke2: #e0e0e0;
        --colorBrandBackground2: #ebf3fc;
        --colorBrandForeground1: #0f6cbd;
        --borderRadiusLarge: 6px;
        --borderRadiusCircular: 9999px;
        --fontSizeBase200: 12px;
      }

      .app-rail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 8px 4px 12px;
        width: 76px;
        height: 712px;
        background-color: var(--colorNeutralBackground2);
        box-shadow: inset -1px 0 0 0 var(--colorNeutralStroke2);
      }

      .app-rail__rail-item-engagement-requests {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 4px 2px;
        flex-shrink: 0;
        align-self: stretch;
      }

      .app-rail__icon-box {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 40px;
        height: 32px;
        background-color: var(--colorBrandBackground2);
        border-radius: var(--borderRadiusLarge);
      }

      .app-rail__clipboard-list-icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        color: var(--colorBrandForeground1);
        stroke-width: 1.5;
      }

      .app-rail__label {
        color: var(--colorBrandForeground1);
        font-family: 'Segoe UI', 'Selawik', sans-serif;
        font-size: var(--fontSizeBase200);
        font-weight: 600;
        line-height: 1.333;
        text-align: center;
        white-space: pre;
      }

      .app-rail__rail-item-internal-assessments {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 4px 2px;
        flex-shrink: 0;
        align-self: stretch;
      }

      .app-rail__icon-box-2 {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 40px;
        height: 32px;
        border-radius: var(--borderRadiusLarge);
      }

      .app-rail__file-text-icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        color: var(--colorNeutralForeground2);
        stroke-width: 1.5;
      }

      .app-rail__label-2 {
        color: var(--colorNeutralForeground3);
        font-family: 'Segoe UI', 'Selawik', sans-serif;
        font-size: var(--fontSizeBase200);
        line-height: 1.333;
        text-align: center;
        white-space: pre;
      }

      .app-rail__spacer {
        flex: 1 1 0;
        align-self: stretch;
        min-height: 0;
      }

      .app-rail__divider {
        width: 36px;
        height: 1px;
        flex-shrink: 0;
        background-color: var(--colorNeutralStroke2);
      }

      .app-rail__search {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }

      .app-rail__search-icon {
        width: 20px;
        height: 20px;
        color: var(--colorNeutralForeground2);
        stroke-width: 1.5;
      }

      .app-rail__shortcut {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .app-rail__key-ctrl {
        position: relative;
        width: 17px;
        height: 16px;
        background-color: var(--colorNeutralBackground5);
        border-radius: 2px;
      }

      .app-rail__ctrl {
        position: absolute;
        left: 0;
        top: 0;
        color: var(--colorNeutralForeground3);
        font-family: 'Segoe UI', 'Selawik', sans-serif;
        font-size: var(--fontSizeBase200);
        line-height: 1.333;
        white-space: pre;
      }

      .app-rail__text {
        color: var(--colorNeutralForeground3);
        font-family: 'Segoe UI', 'Selawik', sans-serif;
        font-size: var(--fontSizeBase200);
        line-height: 1.333;
        white-space: pre;
      }

      .app-rail__key-k {
        position: relative;
        width: 6px;
        height: 16px;
        background-color: var(--colorNeutralBackground5);
        border-radius: 2px;
      }

      .app-rail__k {
        position: absolute;
        left: 0;
        top: 0;
        color: var(--colorNeutralForeground3);
        font-family: 'Segoe UI', 'Selawik', sans-serif;
        font-size: var(--fontSizeBase200);
        line-height: 1.333;
        white-space: pre;
      }

      .app-rail__workspace-icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        color: var(--colorNeutralForeground2);
        stroke-width: 1.5;
      }

      .app-rail__app-launcher-icon {
        position: relative;
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }

      .app-rail__circle-1 {
        position: absolute;
        left: 2.7px;
        top: 2.7px;
        width: 2.6px;
        height: 2.6px;
      }

      .app-rail__circle-2 {
        position: absolute;
        left: 8.7px;
        top: 2.7px;
        width: 2.6px;
        height: 2.6px;
      }

      .app-rail__circle-3 {
        position: absolute;
        left: 14.7px;
        top: 2.7px;
        width: 2.6px;
        height: 2.6px;
      }

      .app-rail__circle-4 {
        position: absolute;
        left: 2.7px;
        top: 8.7px;
        width: 2.6px;
        height: 2.6px;
      }

      .app-rail__circle-5 {
        position: absolute;
        left: 8.7px;
        top: 8.7px;
        width: 2.6px;
        height: 2.6px;
      }

      .app-rail__circle-6 {
        position: absolute;
        left: 14.7px;
        top: 8.7px;
        width: 2.6px;
        height: 2.6px;
      }

      .app-rail__circle-7 {
        position: absolute;
        left: 2.7px;
        top: 14.7px;
        width: 2.6px;
        height: 2.6px;
      }

      .app-rail__circle-8 {
        position: absolute;
        left: 8.7px;
        top: 14.7px;
        width: 2.6px;
        height: 2.6px;
      }

      .app-rail__circle-9 {
        position: absolute;
        left: 14.7px;
        top: 14.7px;
        width: 2.6px;
        height: 2.6px;
      }

      .app-rail__avatar {
        position: relative;
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        border-radius: var(--borderRadiusCircular);
        overflow: hidden;
      }

      .app-rail__avatar-crop {
        position: absolute;
        left: -23px;
        top: -585px;
        width: 1248px;
        height: 629px;
        object-fit: cover;
      }
    </style>
  </head>
