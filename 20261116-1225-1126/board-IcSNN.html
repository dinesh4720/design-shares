<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Engagement subnav</title>
    <style>
      /* The fonts ship beside the page (assets/fonts/), so text looks the same on every system. */

      /* Segoe UI from Google Fonts, under the SIL Open Font License or Apache License 2.0, https://fonts.google.com */

      @font-face {
        font-family: 'Segoe UI';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: local('Segoe UI'), url("assets/fonts/segoe-ui-600-figma.ttf") format("truetype");
        ascent-override: 107.91%;
        descent-override: 25.1%;
        line-gap-override: 0%;
      }

      @font-face {
        font-family: 'Segoe UI';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: local('Segoe UI'), url("assets/fonts/segoe-ui-400-figma.ttf") format("truetype");
        ascent-override: 107.91%;
        descent-override: 25.1%;
        line-gap-override: 0%;
      }

      body {
        margin: 0;
        background: var(--colorNeutralBackground2);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --colorNeutralForeground1: #242424;
        --colorNeutralForeground2: #424242;
        --colorNeutralForeground3: #616161;
        --colorNeutralBackground2: #fafafa;
        --colorNeutralStroke2: #e0e0e0;
        --colorBrandBackground2: #ebf3fc;
        --colorBrandForeground1: #0f6cbd;
        --borderRadiusMedium: 4px;
        --fontSizeBase300: 14px;
        --fontSizeBase500: 20px;
      }

      .engagement-subnav {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 256px;
        height: 712px;
        background-color: var(--colorNeutralBackground2);
        box-shadow: inset -1px 0 0 0 var(--colorNeutralStroke2);
      }

      .engagement-subnav__subnav-title-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 16px 0 8px;
        height: 46px;
        flex-shrink: 0;
        align-self: stretch;
        box-shadow: inset 0 -1px 0 0 var(--colorNeutralStroke2);
      }

      .engagement-subnav__title {
        flex-shrink: 0;
        color: var(--colorNeutralForeground1);
        font-family: 'Segoe UI', 'Selawik', sans-serif;
        font-size: var(--fontSizeBase500);
        font-weight: 600;
        line-height: 1.4;
        white-space: pre;
      }

      .engagement-subnav__collapse-icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        color: var(--colorNeutralForeground3);
        stroke-width: 1.5;
      }

      .engagement-subnav__nav-items {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        padding: 8px;
        flex-shrink: 0;
        align-self: stretch;
      }

      .engagement-subnav__nav-item-requests {
        display: flex;
        align-items: center;
        padding: 0 12px 0 24px;
        height: 32px;
        align-self: stretch;
        background-color: var(--colorBrandBackground2);
        border-radius: var(--borderRadiusMedium);
      }

      .engagement-subnav__label {
        flex-shrink: 0;
        color: var(--colorBrandForeground1);
        font-family: 'Segoe UI', 'Selawik', sans-serif;
        font-size: var(--fontSizeBase300);
        line-height: 1.429;
        white-space: pre;
      }

      .engagement-subnav__nav-item-workflows {
        display: flex;
        align-items: center;
        padding: 0 12px 0 24px;
        height: 32px;
        align-self: stretch;
        border-radius: var(--borderRadiusMedium);
      }

      .engagement-subnav__label-2 {
        flex-shrink: 0;
        color: var(--colorNeutralForeground2);
        font-family: 'Segoe UI', 'Selawik', sans-serif;
        font-size: var(--fontSizeBase300);
        line-height: 1.429;
        white-space: pre;
      }

      .engagement-subnav__nav-item-automation {
        display: flex;
        align-items: center;
        padding: 0 12px 0 24px;
        height: 32px;
        align-self: stretch;
        border-radius: var(--borderRadiusMedium);
      }

      .engagement-subnav__label-3 {
        flex-shrink: 0;
        color: var(--colorNeutralForeground2);
        font-family: 'Segoe UI', 'Selawik', sans-serif;
        font-size: var(--fontSizeBase300);
        line-height: 1.429;
        white-space: pre;
      }

      .engagement-subnav__nav-item-scheme-definition {
        display: flex;
        align-items: center;
        padding: 0 12px 0 24px;
        height: 32px;
        align-self: stretch;
        border-radius: var(--borderRadiusMedium);
      }

      .engagement-subnav__label-4 {
        flex-shrink: 0;
        color: var(--colorNeutralForeground2);
        font-family: 'Segoe UI', 'Selawik', sans-serif;
        font-size: var(--fontSizeBase300);
        line-height: 1.429;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div class="engagement-subnav" data-component="engagement-subnav">
      <div class="engagement-subnav__subnav-title-row">
        <h1 class="engagement-subnav__title">Engagement requests</h1>
        <svg class="engagement-subnav__collapse-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>
      </div>
      <nav class="engagement-subnav__nav-items">
        <div class="engagement-subnav__nav-item-requests">
          <p class="engagement-subnav__label">Requests</p>
        </div>
        <div class="engagement-subnav__nav-item-workflows">
          <p class="engagement-subnav__label-2">Workflows</p>
        </div>
        <div class="engagement-subnav__nav-item-automation">
          <p class="engagement-subnav__label-3">Automation</p>
        </div>
        <div class="engagement-subnav__nav-item-scheme-definition">
          <p class="engagement-subnav__label-4">Scheme definition</p>
        </div>
      </nav>
    </div>
  </body>
</html>
