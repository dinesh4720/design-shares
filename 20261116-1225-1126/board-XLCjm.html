<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Input</title>
    <style>
      /* The fonts ship beside the page (assets/fonts/), so text looks the same on every system. */

      /* Segoe UI from Google Fonts, under the SIL Open Font License or Apache License 2.0, https://fonts.google.com */

      @font-face {
        font-family: 'Segoe UI';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: local('Segoe UI'), url("assets/fonts/segoe-ui-400-figma.ttf") format("truetype");
        ascent-override: 107.91%;
        descent-override: 25.1%;
        line-gap-override: 0%;
      }

      body {
        margin: 0;
        background: var(--colorNeutralStroke1);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --colorNeutralForeground4: #707070;
        --colorNeutralBackground1: #ffffff;
        --colorNeutralStroke1: #d1d1d1;
        --colorNeutralStrokeAccessible: #616161;
        --borderRadiusMedium: 4px;
        --fontSizeBase300: 14px;
      }

      .input {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 1px 1px 0;
        width: 240px;
        background-color: var(--colorNeutralStroke1);
        border-radius: var(--borderRadiusMedium);
        overflow: hidden;
      }

      .input__field {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        height: 30px;
        align-self: stretch;
        background-color: var(--colorNeutralBackground1);
        border-radius: 3px 3px 0 0;
      }

      .input__value {
        flex: 1 1 0;
        min-width: 0;
        color: var(--colorNeutralForeground4);
        font-family: 'Segoe UI', 'Selawik', sans-serif;
        font-size: var(--fontSizeBase300);
        line-height: 1.429;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }

      .input__underline {
        height: 1px;
        align-self: stretch;
        background-color: var(--colorNeutralStrokeAccessible);
      }
    </style>
  </head>
  <body>
    <div class="input" data-component="input">
      <div class="input__field">
        <p class="input__value">Placeholder</p>
      </div>
      <div class="input__underline"></div>
    </div>
  </body>
</html>
