<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Components · Landing page</title>
    <script src="prototype.js"></script>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: var(--band);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --band: #100e12;
        --ink: #f4efe6;
        --muted: #a59d95;
        --brand: #e0263a;
        --on-brand: #ffffff;
        --text-s: 15px;
        --text-m: 17px;
        --radius-full: 999px;
      }

      .components {
        display: flex;
        align-items: center;
        gap: 48px;
        padding: 48px;
        width: 1440px;
        background-color: var(--band);
      }

      .button-primary {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 28px;
        height: 52px;
        flex-shrink: 0;
        background-color: var(--brand);
        border-radius: var(--radius-full);
        box-shadow: 0 0 40px rgba(224, 38, 58, 0.45);
      }

      .button-primary__icon {
        width: 18px;
        height: 18px;
        color: var(--on-brand);
      }

      .button-primary__label {
        color: var(--on-brand);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-m);
        font-weight: 600;
        line-height: 1.3;
        white-space: pre;
      }

      .button-ghost {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 28px;
        height: 52px;
        flex-shrink: 0;
        border-radius: var(--radius-full);
        box-shadow: inset 0 0 0 1px var(--muted);
      }

      .button-ghost__label {
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-m);
        font-weight: 600;
        line-height: 1.3;
        white-space: pre;
      }

      .button-ghost__icon {
        width: 18px;
        height: 18px;
        color: var(--ink);
      }

      .button-outline-small {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 18px;
        height: 40px;
        flex-shrink: 0;
        border-radius: var(--radius-full);
        box-shadow: inset 0 0 0 1px var(--ink);
      }

      .button-outline-small__label {
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-s);
        font-weight: 600;
        line-height: 1.3;
        white-space: pre;
      }

      .button-outline-small__icon {
        width: 16px;
        height: 16px;
        color: var(--ink);
      }

      /* Prototype: what can be clicked, overlays and page transitions (prototype.js runs them). */

      [data-click], [data-hover] {
        cursor: pointer;
      }

      @view-transition {
        navigation: auto;
      }

      @media (prefers-reduced-motion: reduce) {
        @view-transition {
          navigation: none;
        }
      }

      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: var(--transition-duration, 300ms);
        animation-timing-function: var(--transition-easing, ease-out);
      }

      html:active-view-transition-type(dissolve)::view-transition-old(root) {
        animation-name: none;
        mix-blend-mode: normal;
      }

      html:active-view-transition-type(dissolve)::view-transition-new(root) {
        animation-name: prototype-fade-in;
        mix-blend-mode: normal;
      }

      @keyframes prototype-fade-in {
        from { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div class="components">
      <a class="button-primary" href="#" data-component="button-primary">
        <svg class="button-primary__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
        <p class="button-primary__label">Start with episode 1</p>
      </a>
      <a class="button-ghost" href="#" data-component="button-ghost">
        <p class="button-ghost__label">Meet the Black Bulls</p>
        <svg class="button-ghost__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
      </a>
      <a class="button-outline-small" href="#" data-component="button-outline-small">
        <p class="button-outline-small__label">Open dossier</p>
        <svg class="button-outline-small__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
      </a>
    </div>
  </body>
</html>
