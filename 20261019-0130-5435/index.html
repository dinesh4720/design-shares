<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untitled 2 · snapshot</title>
<style>
  :root { color-scheme: light dark; --bg: #f0f0f0; --panel: #fff; --line: #e6e6e6; --text: #1a1a1a; --muted: #6b6b6b; --accent: #0763c8; --on: #e8e8e8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101010; --panel: #1e1e1e; --line: #2c2c2c; --text: #ececec; --muted: #a1a1a1; --accent: #80b5f7; --on: #363636; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  header { display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
  header svg { flex: none; }
  .words { display: grid; min-width: 0; line-height: 1.2; }
  .words strong { font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .words span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: flex; gap: 2px; margin-left: auto; padding: 3px; border-radius: 10px; background: var(--bg); }
  .seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font: inherit; font-weight: 500; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
  .seg button:disabled { opacity: .45; cursor: default; }
  a.open { color: var(--accent); text-decoration: none; font-weight: 500; font-size: 12.5px; white-space: nowrap; }
  a.open:hover { text-decoration: underline; }
  main { flex: 1; min-height: 0; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  iframe[hidden] { display: none; }
  .none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 48 48" width="22" height="22" fill="none" aria-hidden="true"><rect width="48" height="48" rx="11" fill="#15161c"/><path d="M24 14c-7 0-12 5-12 11s5 11 12 11 12-5 12-11-5-11-12-11zm0 5c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6 2.7-6 6-6z" fill="rgba(255,255,255,.18)"/><circle cx="24" cy="25" r="8.5" stroke="rgba(255,255,255,.55)" stroke-width="2.2"/><circle cx="31" cy="18" r="2.2" fill="#fff"/></svg>
  <div class="words"><strong>Untitled 2</strong><span>Tally · 4 boards · 19 Oct 2026, 01:30</span></div>
  <div class="seg" role="group" aria-label="View">
    <button type="button" data-view="design" aria-pressed="true">Design</button>
    <button type="button" data-view="prototype" aria-pressed="false">Prototype</button>
  </div>
  <a class="open" id="open" href="design.html" target="_blank" rel="noopener">Open full size ↗</a>
</header>
<main>
  <iframe id="design" src="design.html" title="Design"></iframe>
  <iframe id="prototype" src="prototype/index.html" title="Prototype" hidden></iframe>
</main>
<script>
  (function () {
    var buttons = document.querySelectorAll(".seg button");
    var open = document.getElementById("open");
    function show(view) {
      for (var i = 0; i < buttons.length; i++) buttons[i].setAttribute("aria-pressed", String(buttons[i].dataset.view === view));
      var design = document.getElementById("design"), proto = document.getElementById("prototype");
      design.hidden = view !== "design";
      if (proto) proto.hidden = view !== "prototype";
      open.href = view === "prototype" ? "prototype/index.html" : "design.html";
      try { history.replaceState(null, "", "#" + view); } catch (e) {}
    }
    for (var i = 0; i < buttons.length; i++) buttons[i].addEventListener("click", function () { if (!this.disabled) show(this.dataset.view); });
    if (location.hash === "#prototype" && true) show("prototype");
  })();
</script>
</body>
</html>
