<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home · Link test</title>
    <script src="prototype.js"></script>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .home {
        position: relative;
        width: 800px;
        height: 500px;
      }

      .home__title {
        position: absolute;
        left: 64px;
        top: 72px;
        font-size: 40px;
        line-height: 1.3;
        white-space: pre;
      }

      .home__body {
        position: absolute;
        left: 64px;
        top: 140px;
        font-size: 18px;
        line-height: 1.3;
        white-space: pre;
      }

      /* Prototype: what can be clicked, overlays and page transitions (prototype.js runs them). */

      [data-click], [data-hover] {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="home">
      <h1 class="home__title">Share link check</h1>
      <p class="home__body">If you can read this on github.io, Share works off this Mac.</p>
    </div>
  </body>
</html>
