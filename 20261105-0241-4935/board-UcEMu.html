<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>File table header</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: var(--sunken);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --text-xs: 12px;
        --space-xs: 8px;
        --space-m: 16px;
      }

      :root, [data-mode] {
        --sunken: #f7f6f4;
        --muted: #646462;
      }

      [data-mode="dark"] {
        --sunken: #161513;
        --muted: #a8a7a1;
      }

      .file-table-header {
        display: flex;
        align-items: flex-start;
        width: 880px;
        background-color: var(--sunken);
      }

      .file-table-header__file-heading {
        display: flex;
        align-items: flex-start;
        padding: var(--space-xs) var(--space-m);
        width: 320px;
        flex-shrink: 0;
      }

      .file-table-header__heading-label {
        flex-shrink: 0;
        color: var(--muted);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-xs);
        font-weight: 500;
        line-height: 1.3;
        white-space: pre;
      }

      .file-table-header__what-changes-heading {
        display: flex;
        align-items: flex-start;
        padding: var(--space-xs) var(--space-m);
        flex: 1 1 0;
        min-width: 0;
      }

      .file-table-header__heading-label-2 {
        flex-shrink: 0;
        color: var(--muted);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-xs);
        font-weight: 500;
        line-height: 1.3;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <header class="file-table-header" data-component="file-table-header">
      <div class="file-table-header__file-heading">
        <p class="file-table-header__heading-label">File</p>
      </div>
      <div class="file-table-header__what-changes-heading">
        <p class="file-table-header__heading-label-2">What changes</p>
      </div>
    </header>
  </body>
</html>
