<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat composer</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: var(--raised);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --text-xs: 12px;
        --text-m: 14px;
        --space-xs: 8px;
        --space-s: 12px;
        --space-m: 16px;
        --radius-l: 12px;
        --radius-full: 999px;
        --icon-s: 16px;
      }

      :root, [data-mode] {
        --raised: #ffffff;
        --line: #e5e4e3;
        --muted: #646462;
        --primary: #23221e;
        --on-primary: #ffffff;
      }

      [data-mode="dark"] {
        --raised: #262521;
        --line: #34332e;
        --muted: #a8a7a1;
        --primary: #f2f1ed;
        --on-primary: #1b1a17;
      }

      .chat-composer {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-xs);
        padding: var(--space-s) var(--space-s) var(--space-s) var(--space-m);
        width: 400px;
        background-color: var(--raised);
        border-radius: var(--radius-l);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .chat-composer__composer-placeholder {
        align-self: stretch;
        color: var(--muted);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-m);
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }

      .chat-composer__composer-row {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        align-self: stretch;
      }

      .chat-composer__composer-hint {
        flex: 1 1 0;
        min-width: 0;
        color: var(--muted);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-xs);
        line-height: 1.3;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }

      .send-button {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        background-color: var(--primary);
        border-radius: var(--radius-full);
      }

      .send-button__send-icon {
        width: var(--icon-s);
        height: var(--icon-s);
        flex-shrink: 0;
        color: var(--on-primary);
        stroke-width: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="chat-composer" data-component="chat-composer">
      <p class="chat-composer__composer-placeholder">Ask about this point</p>
      <div class="chat-composer__composer-row">
        <p class="chat-composer__composer-hint">Enter to send · Shift + Enter for a new line</p>
        <button class="send-button" type="button" data-instance-of="send-button">
          <svg class="send-button__send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Send"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
        </button>
      </div>
    </div>
  </body>
</html>
