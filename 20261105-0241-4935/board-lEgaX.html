<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Option card</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: var(--raised);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --text-m: 14px;
        --space-xs: 8px;
        --space-m: 16px;
        --radius-m: 8px;
        --icon-s: 16px;
      }

      :root, [data-mode] {
        --raised: #ffffff;
        --line: #e5e4e3;
        --ink: #23221e;
        --accepted: #1f9463;
        --rejected: #cf4436;
      }

      [data-mode="dark"] {
        --raised: #262521;
        --line: #34332e;
        --ink: #f2f1ed;
        --accepted: #4cc28b;
        --rejected: #f07a6c;
      }

      .option-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-xs);
        padding: var(--space-m);
        width: 358px;
        background-color: var(--raised);
        border-radius: var(--radius-m);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .option-card__option-card-head {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        align-self: stretch;
      }

      .option-card__option-name {
        flex: 1 1 0;
        min-width: 0;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-m);
        font-weight: 500;
        line-height: 1.4;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }

      .option-card__good-1 {
        display: flex;
        align-items: flex-start;
        gap: var(--space-xs);
        align-self: stretch;
      }

      .option-card__good-1-icon {
        width: var(--icon-s);
        height: var(--icon-s);
        flex-shrink: 0;
        color: var(--accepted);
        stroke-width: 1.5;
      }

      .option-card__good-1-text {
        flex: 1 1 0;
        min-width: 0;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-m);
        line-height: 1.4;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }

      .option-card__bad-1 {
        display: flex;
        align-items: flex-start;
        gap: var(--space-xs);
        align-self: stretch;
      }

      .option-card__bad-1-icon {
        width: var(--icon-s);
        height: var(--icon-s);
        flex-shrink: 0;
        color: var(--rejected);
        stroke-width: 1.5;
      }

      .option-card__bad-1-text {
        flex: 1 1 0;
        min-width: 0;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-m);
        line-height: 1.4;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <div class="option-card" data-component="option-card">
      <div class="option-card__option-card-head">
        <p class="option-card__option-name">No cache</p>
      </div>
      <div class="option-card__good-1">
        <svg class="option-card__good-1-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        <p class="option-card__good-1-text">Always fresh</p>
      </div>
      <div class="option-card__bad-1">
        <svg class="option-card__bad-1-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg>
        <p class="option-card__bad-1-text">Slow screens</p>
      </div>
    </div>
  </body>
</html>
