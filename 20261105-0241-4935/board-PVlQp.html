<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phone status bar</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --text-l: 16px;
        --space-2xs: 4px;
        --space-l: 24px;
        --icon-s: 16px;
      }

      :root, [data-mode] {
        --ink: #23221e;
      }

      [data-mode="dark"] {
        --ink: #f2f1ed;
      }

      .phone-status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 var(--space-l);
        width: 390px;
        height: 48px;
      }

      .phone-status-bar__time {
        flex-shrink: 0;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-l);
        font-weight: 500;
        line-height: 1.2;
        white-space: pre;
      }

      .phone-status-bar__status-icons {
        display: flex;
        align-items: center;
        gap: var(--space-2xs);
        flex-shrink: 0;
      }

      .phone-status-bar__wifi {
        width: var(--icon-s);
        height: var(--icon-s);
        color: var(--ink);
        stroke-width: 1.5;
      }

      .phone-status-bar__battery {
        width: var(--icon-s);
        height: var(--icon-s);
        color: var(--ink);
        stroke-width: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="phone-status-bar" data-component="phone-status-bar">
      <p class="phone-status-bar__time">9:41</p>
      <div class="phone-status-bar__status-icons">
        <svg class="phone-status-bar__wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg>
        <svg class="phone-status-bar__battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 10v4"/><path d="M14 10v4"/><path d="M22 14v-4"/><path d="M6 10v4"/><rect x="2" y="6" width="16" height="12" rx="2"/></svg>
      </div>
    </div>
  </body>
</html>
