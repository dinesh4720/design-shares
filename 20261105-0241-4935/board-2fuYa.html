<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Filter chip / Selected</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: var(--primary);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --text-s: 13px;
        --space-2xs: 4px;
        --space-s: 12px;
        --radius-full: 999px;
      }

      :root, [data-mode] {
        --primary: #23221e;
        --on-primary: #ffffff;
      }

      [data-mode="dark"] {
        --primary: #f2f1ed;
        --on-primary: #1b1a17;
      }

      .filter-chip-selected {
        display: flex;
        align-items: center;
        padding: var(--space-2xs) var(--space-s);
        width: fit-content;
        background-color: var(--primary);
        border-radius: var(--radius-full);
        box-shadow: inset 0 0 0 1px var(--primary);
      }

      .filter-chip-selected__label {
        color: var(--on-primary);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-s);
        font-weight: 500;
        line-height: 1.3;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div class="filter-chip-selected" data-component="filter-chip-selected" data-instance-of="filter-chip">
      <p class="filter-chip-selected__label">All</p>
    </div>
  </body>
</html>
