<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat message / Claude</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --text-xs: 12px;
        --text-m: 14px;
        --space-2xs: 4px;
        --radius-full: 999px;
      }

      :root, [data-mode] {
        --bg: #ffffff;
        --ink: #23221e;
        --muted: #646462;
      }

      [data-mode="dark"] {
        --bg: #1b1a17;
        --ink: #f2f1ed;
        --muted: #a8a7a1;
      }

      .chat-message-claude {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-2xs);
        width: 400px;
      }

      .chat-message-claude__thread-dot {
        position: absolute;
        left: -20px;
        top: 4px;
        width: 9px;
        height: 9px;
        background-color: var(--bg);
        border-radius: var(--radius-full);
        box-shadow: inset 0 0 0 1px var(--muted);
      }

      .chat-message-claude__sender {
        position: relative;
        color: var(--muted);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-xs);
        font-weight: 500;
        line-height: 1.3;
        white-space: pre;
      }

      .chat-message-claude__message-text {
        position: relative;
        align-self: stretch;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-m);
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <div class="chat-message-claude" data-component="chat-message-claude">
      <div class="chat-message-claude__thread-dot"></div>
      <p class="chat-message-claude__sender">Claude</p>
      <p class="chat-message-claude__message-text">The main risk is old safety data.</p>
    </div>
  </body>
</html>
