<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Discussed point</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: var(--proposed-soft);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --text-xs: 12px;
        --text-m: 14px;
        --space-2xs: 4px;
        --space-xs: 8px;
        --space-s: 12px;
        --space-m: 16px;
        --radius-m: 8px;
        --icon-s: 16px;
      }

      :root, [data-mode] {
        --ink: #23221e;
        --proposed: #3f72e0;
        --proposed-soft: #ebf1fd;
        --proposed-ink: #2552b7;
      }

      [data-mode="dark"] {
        --ink: #f2f1ed;
        --proposed: #7ea2f2;
        --proposed-soft: #30353c;
        --proposed-ink: #9ebdff;
      }

      .discussed-point {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-2xs);
        padding: var(--space-s) var(--space-m);
        width: 400px;
        background-color: var(--proposed-soft);
        border-radius: var(--radius-m);
        box-shadow: inset 0 0 0 1px var(--proposed);
      }

      .discussed-point__point-source {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        align-self: stretch;
      }

      .discussed-point__point-section {
        flex: 1 1 0;
        min-width: 0;
        color: var(--proposed-ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-xs);
        font-weight: 500;
        line-height: 1.3;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }

      .discussed-point__show-on-page {
        display: flex;
        align-items: center;
        gap: var(--space-2xs);
        flex-shrink: 0;
      }

      .discussed-point__show-icon {
        width: var(--icon-s);
        height: var(--icon-s);
        color: var(--proposed-ink);
        stroke-width: 1.5;
      }

      .discussed-point__show-label {
        color: var(--proposed-ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-xs);
        font-weight: 500;
        line-height: 1.3;
        white-space: pre;
      }

      .discussed-point__point-quote {
        align-self: stretch;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-m);
        font-weight: 500;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <div class="discussed-point" data-component="discussed-point">
      <div class="discussed-point__point-source">
        <p class="discussed-point__point-section">What we give up</p>
        <div class="discussed-point__show-on-page">
          <svg class="discussed-point__show-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          <p class="discussed-point__show-label">Show on page</p>
        </div>
      </div>
      <p class="discussed-point__point-quote">Data can be up to 5 minutes old.</p>
    </div>
  </body>
</html>
