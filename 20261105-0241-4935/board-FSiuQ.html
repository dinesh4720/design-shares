<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent inbox panel / Loading</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: var(--raised);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --text-s: 13px;
        --text-xl: 20px;
        --space-2xs: 4px;
        --space-xs: 8px;
        --space-s: 12px;
        --space-m: 16px;
        --space-l: 24px;
        --radius-s: 6px;
        --radius-m: 8px;
        --radius-l: 12px;
        --icon-s: 16px;
      }

      :root, [data-mode] {
        --sunken: #f7f6f4;
        --raised: #ffffff;
        --line: #e5e4e3;
        --ink: #23221e;
        --muted: #646462;
        --primary: #23221e;
        --on-primary: #ffffff;
      }

      [data-mode="dark"] {
        --sunken: #161513;
        --raised: #262521;
        --line: #34332e;
        --ink: #f2f1ed;
        --muted: #a8a7a1;
        --primary: #f2f1ed;
        --on-primary: #1b1a17;
      }

      .agent-inbox-panel-loading {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 520px;
        height: 992px;
        background-color: var(--raised);
      }

      .agent-inbox-panel-loading__inbox-header {
        display: flex;
        align-items: flex-start;
        gap: var(--space-s);
        padding: var(--space-m) var(--space-s) var(--space-m) var(--space-l);
        flex-shrink: 0;
        align-self: stretch;
      }

      .agent-inbox-panel-loading__inbox-title-group {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-2xs);
        flex: 1 1 0;
        min-width: 0;
      }

      .agent-inbox-panel-loading__inbox-title {
        color: var(--ink);
        font-family: Charter, 'Bitstream Charter', 'Sitka Text', Georgia, serif;
        font-size: var(--text-xl);
        font-weight: 700;
        line-height: 1.2;
        white-space: pre;
      }

      .agent-inbox-panel-loading__inbox-subtitle {
        color: var(--muted);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-s);
        line-height: 1.4;
        white-space: pre;
      }

      .icon-button {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        border-radius: var(--radius-m);
      }

      .icon-button__button-icon {
        width: var(--icon-s);
        height: var(--icon-s);
        flex-shrink: 0;
        color: var(--ink);
        stroke-width: 1.5;
      }

      .agent-inbox-panel-loading__inbox-actions {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        padding: 0 var(--space-l) var(--space-m);
        flex-shrink: 0;
        align-self: stretch;
        box-shadow: inset 0 -1px 0 0 var(--line);
        opacity: 0.4;
      }

      .button-primary {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: var(--space-xs);
        padding: 0 var(--space-s);
        height: 32px;
        flex-shrink: 0;
        background-color: var(--primary);
        border-radius: var(--radius-m);
      }

      .button-primary__button-icon {
        width: var(--icon-s);
        height: var(--icon-s);
        color: var(--on-primary);
        stroke-width: 1.5;
      }

      .button-primary__label {
        color: var(--on-primary);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-s);
        font-weight: 500;
        line-height: 1.2;
        white-space: pre;
      }

      .button-secondary {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: var(--space-xs);
        padding: 0 var(--space-s);
        height: 32px;
        flex-shrink: 0;
        background-color: var(--raised);
        border-radius: var(--radius-m);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .button-secondary__button-icon {
        width: var(--icon-s);
        height: var(--icon-s);
        color: var(--muted);
        stroke-width: 1.5;
      }

      .button-secondary__label {
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-s);
        font-weight: 500;
        line-height: 1.2;
        white-space: pre;
      }

      .agent-inbox-panel-loading__inbox-list {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-m);
        padding: var(--space-l);
        flex: 1 1 0;
        align-self: stretch;
        min-height: 0;
        background-color: var(--sunken);
        overflow-x: hidden;
        overflow-y: auto;
      }

      .agent-inbox-panel-loading__inbox-loading {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-m);
        flex-shrink: 0;
        align-self: stretch;
      }

      .note-skeleton {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-s);
        padding: var(--space-m);
        align-self: stretch;
        background-color: var(--raised);
        border-radius: var(--radius-l);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .note-skeleton__source-bar {
        width: 160px;
        height: 12px;
        background-color: var(--line);
        border-radius: var(--radius-s);
      }

      .note-skeleton__point-bar {
        width: 280px;
        height: 16px;
        background-color: var(--line);
        border-radius: var(--radius-s);
      }

      .note-skeleton__label-bar-1 {
        width: 64px;
        height: 12px;
        background-color: var(--line);
        border-radius: var(--radius-s);
      }

      .note-skeleton__value-bar-1 {
        width: 340px;
        height: 12px;
        background-color: var(--line);
        border-radius: var(--radius-s);
      }

      .note-skeleton__label-bar-2 {
        width: 96px;
        height: 12px;
        background-color: var(--line);
        border-radius: var(--radius-s);
      }

      .note-skeleton__value-bar-2 {
        width: 300px;
        height: 12px;
        background-color: var(--line);
        border-radius: var(--radius-s);
      }
    </style>
  </head>
  <body>
    <div class="agent-inbox-panel-loading" data-component="agent-inbox-panel-loading" data-instance-of="agent-inbox-panel">
      <header class="agent-inbox-panel-loading__inbox-header">
        <div class="agent-inbox-panel-loading__inbox-title-group">
          <h1 class="agent-inbox-panel-loading__inbox-title">Agent inbox</h1>
          <p class="agent-inbox-panel-loading__inbox-subtitle">Loading notes…</p>
        </div>
        <button class="icon-button" type="button" data-instance-of="icon-button">
          <svg class="icon-button__button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Close inbox (Esc)"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </header>
      <div class="agent-inbox-panel-loading__inbox-actions">
        <button class="button-primary" type="button" data-instance-of="button-primary">
          <svg class="button-primary__button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          <span class="button-primary__label">Copy all for agent</span>
        </button>
        <button class="button-secondary" type="button" data-instance-of="button-secondary">
          <svg class="button-secondary__button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg>
          <span class="button-secondary__label">Mark all as sent</span>
        </button>
      </div>
      <div class="agent-inbox-panel-loading__inbox-list">
        <div class="agent-inbox-panel-loading__inbox-loading">
          <div class="note-skeleton" data-instance-of="note-skeleton">
            <div class="note-skeleton__source-bar"></div>
            <div class="note-skeleton__point-bar"></div>
            <div class="note-skeleton__label-bar-1"></div>
            <div class="note-skeleton__value-bar-1"></div>
            <div class="note-skeleton__label-bar-2"></div>
            <div class="note-skeleton__value-bar-2"></div>
          </div>
          <div class="note-skeleton" data-instance-of="note-skeleton">
            <div class="note-skeleton__source-bar"></div>
            <div class="note-skeleton__point-bar"></div>
            <div class="note-skeleton__label-bar-1"></div>
            <div class="note-skeleton__value-bar-1"></div>
            <div class="note-skeleton__label-bar-2"></div>
            <div class="note-skeleton__value-bar-2"></div>
          </div>
          <div class="note-skeleton" data-instance-of="note-skeleton">
            <div class="note-skeleton__source-bar"></div>
            <div class="note-skeleton__point-bar"></div>
            <div class="note-skeleton__label-bar-1"></div>
            <div class="note-skeleton__value-bar-1"></div>
            <div class="note-skeleton__label-bar-2"></div>
            <div class="note-skeleton__value-bar-2"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
