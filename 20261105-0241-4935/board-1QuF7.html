<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Needs you badge</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: var(--attention);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --text-xs: 12px;
        --space-2xs: 4px;
        --space-xs: 8px;
        --radius-full: 999px;
        --icon-s: 16px;
      }

      :root, [data-mode] {
        --attention: #c4441c;
        --on-attention: #ffffff;
      }

      [data-mode="dark"] {
        --attention: #f0683f;
        --on-attention: #1b1a17;
      }

      .needs-you-badge {
        display: flex;
        align-items: center;
        gap: var(--space-2xs);
        padding: var(--space-2xs) var(--space-xs);
        width: fit-content;
        background-color: var(--attention);
        border-radius: var(--radius-full);
      }

      .needs-you-badge__pause-icon {
        width: var(--icon-s);
        height: var(--icon-s);
        color: var(--on-attention);
        stroke-width: 1.5;
      }

      .needs-you-badge__label {
        color: var(--on-attention);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-xs);
        font-weight: 500;
        line-height: 1.3;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div class="needs-you-badge" data-component="needs-you-badge">
      <svg class="needs-you-badge__pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="10" x2="10" y1="15" y2="9"/><line x1="14" x2="14" y1="15" y2="9"/></svg>
      <p class="needs-you-badge__label">Needs you</p>
    </div>
  </body>
</html>
