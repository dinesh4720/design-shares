<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Point block / Hover</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: var(--raised);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --text-m: 14px;
        --space-s: 12px;
        --space-m: 16px;
        --radius-s: 6px;
        --radius-m: 8px;
        --icon-s: 16px;
      }

      :root, [data-mode] {
        --sunken: #f7f6f4;
        --raised: #ffffff;
        --line-strong: #8c8b86;
        --ink: #23221e;
      }

      [data-mode="dark"] {
        --sunken: #161513;
        --raised: #262521;
        --line-strong: #6b6a64;
        --ink: #f2f1ed;
      }

      .point-block-hover {
        display: flex;
        align-items: flex-start;
        gap: var(--space-s);
        padding: var(--space-s) var(--space-m);
        width: 280px;
        background-color: var(--raised);
        border-radius: var(--radius-m);
        box-shadow: inset 0 0 0 1px var(--line-strong);
      }

      .point-block-hover__point-text {
        flex: 1 1 0;
        min-width: 0;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-m);
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }

      .discuss-icon-button {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        background-color: var(--sunken);
        border-radius: var(--radius-s);
      }

      .discuss-icon-button__chat-icon {
        width: var(--icon-s);
        height: var(--icon-s);
        flex-shrink: 0;
        color: var(--ink);
        stroke-width: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="point-block-hover" data-component="point-block-hover" data-instance-of="point-block">
      <p class="point-block-hover__point-text">We run 4 servers. One shared cache keeps them in sync.</p>
      <div class="discuss-icon-button" data-instance-of="discuss-icon-button">
        <svg class="discuss-icon-button__chat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Discuss this point"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/></svg>
      </div>
    </div>
  </body>
</html>
