      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --text-xs: 12px;
        --text-s: 13px;
        --text-m: 14px;
        --text-l: 16px;
        --space-2xs: 4px;
        --space-xs: 8px;
        --space-s: 12px;
        --space-m: 16px;
        --space-l: 24px;
        --space-xl: 32px;
        --radius-s: 6px;
        --radius-m: 8px;
        --radius-l: 12px;
        --radius-full: 999px;
        --icon-s: 16px;
      }

      :root, [data-mode] {
        --bg: #ffffff;
        --sunken: #f7f6f4;
        --raised: #ffffff;
        --line: #e5e4e3;
        --ink: #23221e;
        --muted: #646462;
        --primary: #23221e;
      }

      [data-mode="dark"] {
        --bg: #1b1a17;
        --sunken: #161513;
        --raised: #262521;
        --line: #34332e;
        --ink: #f2f1ed;
        --muted: #a8a7a1;
        --primary: #f2f1ed;
      }

      .board-loading {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 1440px;
        height: 1024px;
        background-color: var(--bg);
        overflow: hidden;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 var(--space-xl);
        height: 56px;
        flex-shrink: 0;
        align-self: stretch;
        background-color: var(--bg);
        box-shadow: inset 0 -1px 0 0 var(--line);
      }

      .top-bar__brand {
        display: flex;
        align-items: center;
        gap: var(--space-s);
        flex-shrink: 0;
      }

      .top-bar__logo-mark {
        position: relative;
        width: 20px;
        height: 20px;
        background-color: var(--primary);
        border-radius: var(--radius-s);
      }

      .top-bar__logo-check {
        position: absolute;
        left: 0;
        top: 0;
        width: 20px;
        height: 20px;
      }

      .top-bar__product-name {
        color: var(--ink);
        font-family: Charter, 'Bitstream Charter', 'Sitka Text', Georgia, serif;
        font-size: var(--text-l);
        font-weight: 700;
        line-height: 1.2;
        white-space: pre;
      }

      .top-bar__divider {
        color: var(--muted);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-m);
        line-height: 1.2;
        white-space: pre;
      }

      .top-bar__project-picker {
        display: flex;
        align-items: center;
        gap: var(--space-2xs);
        padding: var(--space-2xs) var(--space-xs);
        border-radius: var(--radius-m);
      }

      .top-bar__project-name {
        color: var(--ink);
        font-family: Menlo, Consolas, 'DejaVu Sans Mono', monospace;
        font-size: var(--text-s);
        line-height: 1.3;
        white-space: pre;
      }

      .top-bar__picker-icon {
        width: var(--icon-s);
        height: var(--icon-s);
        color: var(--muted);
        stroke-width: 1.5;
      }

      .top-bar__top-actions {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        flex-shrink: 0;
      }

      .button-ghost {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: var(--space-xs);
        padding: 0 var(--space-s);
        height: 32px;
        border-radius: var(--radius-m);
      }

      .button-ghost__button-icon {
        width: var(--icon-s);
        height: var(--icon-s);
        color: var(--muted);
        stroke-width: 1.5;
      }

      .button-ghost__label {
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-s);
        font-weight: 500;
        line-height: 1.2;
        white-space: pre;
      }

      .button-agent-inbox {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        padding: 0 var(--space-xs) 0 var(--space-s);
        height: 32px;
        background-color: var(--raised);
        border-radius: var(--radius-m);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .button-agent-inbox__inbox-icon {
        width: var(--icon-s);
        height: var(--icon-s);
        color: var(--muted);
        stroke-width: 1.5;
      }

      .button-agent-inbox__label {
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-s);
        font-weight: 500;
        line-height: 1.2;
        white-space: pre;
      }

      .icon-button {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 32px;
        height: 32px;
        border-radius: var(--radius-m);
      }

      .icon-button__button-icon {
        width: var(--icon-s);
        height: var(--icon-s);
        flex-shrink: 0;
        color: var(--muted);
        stroke-width: 1.5;
      }

      .board-loading__main {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-l);
        padding: var(--space-xl);
        flex: 1 1 0;
        align-self: stretch;
        min-height: 0;
      }

      .board-loading__summary-skeleton {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-s);
        flex-shrink: 0;
      }

      .board-loading__headline-bar {
        width: 360px;
        height: 32px;
        background-color: var(--line);
        border-radius: var(--radius-s);
      }

      .board-loading__stats-bar {
        width: 240px;
        height: 12px;
        background-color: var(--line);
        border-radius: var(--radius-s);
      }

      .board-loading__filters-skeleton {
        display: flex;
        align-items: flex-start;
        gap: var(--space-xs);
        flex-shrink: 0;
      }

      .board-loading__chip-bar-1 {
        width: 56px;
        height: 28px;
        background-color: var(--sunken);
        border-radius: var(--radius-full);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .board-loading__chip-bar-2 {
        width: 72px;
        height: 28px;
        background-color: var(--sunken);
        border-radius: var(--radius-full);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .board-loading__chip-bar-3 {
        width: 56px;
        height: 28px;
        background-color: var(--sunken);
        border-radius: var(--radius-full);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .board-loading__chip-bar-4 {
        width: 48px;
        height: 28px;
        background-color: var(--sunken);
        border-radius: var(--radius-full);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .board-loading__chip-bar-5 {
        width: 56px;
        height: 28px;
        background-color: var(--sunken);
        border-radius: var(--radius-full);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .board-loading__chip-bar-6 {
        width: 56px;
        height: 28px;
        background-color: var(--sunken);
        border-radius: var(--radius-full);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .board-loading__chip-bar-7 {
        width: 40px;
        height: 28px;
        background-color: var(--sunken);
        border-radius: var(--radius-full);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .board-loading__columns {
        display: flex;
        align-items: flex-start;
        gap: var(--space-m);
        flex: 1 1 0;
        align-self: stretch;
        min-height: 0;
      }

      .board-loading__needs-review-column {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-xs);
        padding: var(--space-xs);
        flex: 1 1 0;
        align-self: stretch;
        min-width: 0;
        background-color: var(--sunken);
        border-radius: var(--radius-l);
      }

      .board-loading__column-header {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        padding: var(--space-2xs) var(--space-xs);
        flex-shrink: 0;
        align-self: stretch;
      }

      .board-loading__column-glyphs {
        display: flex;
        align-items: flex-start;
        gap: var(--space-2xs);
        flex-shrink: 0;
      }

      .status-glyph-proposed {
        position: relative;
        width: 16px;
        height: 16px;
      }

      .status-glyph-proposed__dashed-ring {
        position: absolute;
        left: 0;
        top: 0;
        width: 16px;
        height: 16px;
      }

      .board-loading__column-name {
        flex-shrink: 0;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-s);
        font-weight: 500;
        line-height: 1.3;
        white-space: pre;
      }

      .board-loading__column-count {
        flex-shrink: 0;
        color: var(--muted);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-xs);
        line-height: 1.3;
        white-space: pre;
      }

      .card-skeleton {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-s);
        padding: var(--space-s);
        flex-shrink: 0;
        align-self: stretch;
        background-color: var(--raised);
        border-radius: var(--radius-m);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .card-skeleton__skeleton-meta {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        align-self: stretch;
      }

      .card-skeleton__skeleton-glyph {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        background-color: var(--line);
        border-radius: var(--radius-full);
      }

      .card-skeleton__skeleton-id {
        width: 40px;
        height: 12px;
        flex-shrink: 0;
        background-color: var(--line);
        border-radius: var(--radius-s);
      }

      .card-skeleton__skeleton-area {
        width: 48px;
        height: 12px;
        flex-shrink: 0;
        background-color: var(--line);
        border-radius: var(--radius-s);
      }

      .card-skeleton__skeleton-title {
        width: 220px;
        height: 12px;
        background-color: var(--line);
        border-radius: var(--radius-s);
      }

      .card-skeleton__skeleton-title-2 {
        width: 140px;

      }

      .board-loading__accepted-column {
        display: flex;
        flex-direction: column;
        align-items: flex-start;

        padding: var(--space-xs);

        align-self: stretch;
        min-width: 0;
        background-color: var(--sunken);
        border-radius: var(--radius-l);
      }

        left: 0;

        height: 16px;
      }

      }

      .board-loading__replaced-or-rejected-column {
        display: flex;

      .status-glyph-replaced {

      .status-glyph-replaced__ring {

      }

      }

      }

      .status-glyph-rejected__cross {
        position: absolute;
        left: 0;
        top: 0;
        width: 16px;
        height: 16px;
      }
