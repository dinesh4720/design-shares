<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search field</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: var(--raised);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --text-xs: 12px;
        --text-s: 13px;
        --space-2xs: 4px;
        --space-xs: 8px;
        --space-s: 12px;
        --radius-s: 6px;
        --radius-m: 8px;
        --icon-s: 16px;
      }

      :root, [data-mode] {
        --raised: #ffffff;
        --line: #e5e4e3;
        --muted: #646462;
      }

      [data-mode="dark"] {
        --raised: #262521;
        --line: #34332e;
        --muted: #a8a7a1;
      }

      .search-field {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        padding: 0 var(--space-xs) 0 var(--space-s);
        width: 240px;
        height: 32px;
        background-color: var(--raised);
        border-radius: var(--radius-m);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .search-field__search-icon {
        width: var(--icon-s);
        height: var(--icon-s);
        flex-shrink: 0;
        color: var(--muted);
        stroke-width: 1.5;
      }

      .search-field__placeholder {
        flex: 1 1 0;
        min-width: 0;
        color: var(--muted);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-s);
        line-height: 1.2;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }

      .search-field__shortcut {
        display: flex;
        align-items: flex-start;
        padding: 0 var(--space-2xs);
        flex-shrink: 0;
        border-radius: var(--radius-s);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .search-field__key {
        color: var(--muted);
        font-family: Menlo, Consolas, 'DejaVu Sans Mono', monospace;
        font-size: var(--text-xs);
        line-height: 1.3;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div class="search-field" data-component="search-field">
      <svg class="search-field__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
      <p class="search-field__placeholder">Search decisions</p>
      <div class="search-field__shortcut">
        <p class="search-field__key">/</p>
      </div>
    </div>
  </body>
</html>
