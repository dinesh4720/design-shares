<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flow arrow / Right · Yes</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --text-xs: 12px;
        --space-2xs: 4px;
      }

      :root, [data-mode] {
        --muted: #646462;
      }

      [data-mode="dark"] {
        --muted: #a8a7a1;
      }

      .flow-arrow-right-yes {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-2xs);
        width: 56px;
      }

      .flow-arrow-right-yes__arrow-label {
        color: var(--muted);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-xs);
        font-weight: 500;
        line-height: 1.3;
        white-space: pre;
      }

      .flow-arrow-right-yes__arrow-line {
        display: flex;
        align-items: center;
        height: 12px;
        align-self: stretch;
      }

      .flow-arrow-right-yes__shaft {
        height: 1.5px;
        flex: 1 1 0;
        min-width: 0;
        background-color: var(--muted);
      }

      .flow-arrow-right-yes__head {
        width: 8px;
        height: 12px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="flow-arrow-right-yes" data-component="flow-arrow-right-yes" data-instance-of="flow-arrow-right">
      <p class="flow-arrow-right-yes__arrow-label">Yes</p>
      <div class="flow-arrow-right-yes__arrow-line">
        <div class="flow-arrow-right-yes__shaft"></div>
        <svg class="flow-arrow-right-yes__head" viewBox="0 0 8 12" preserveAspectRatio="none" overflow="visible" aria-hidden="true"><path d="M1 1 L6.5 6 L1 11" fill="none" stroke="#646462" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
      </div>
    </div>
  </body>
</html>
