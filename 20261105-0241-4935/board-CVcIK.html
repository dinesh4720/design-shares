<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phone home indicator</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --radius-full: 999px;
      }

      :root, [data-mode] {
        --ink: #23221e;
      }

      [data-mode="dark"] {
        --ink: #f2f1ed;
      }

      .phone-home-indicator {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 390px;
        height: 32px;
      }

      .phone-home-indicator__home-bar {
        width: 136px;
        height: 4px;
        flex-shrink: 0;
        background-color: var(--ink);
        border-radius: var(--radius-full);
      }
    </style>
  </head>
  <body>
    <div class="phone-home-indicator" data-component="phone-home-indicator">
      <div class="phone-home-indicator__home-bar"></div>
    </div>
  </body>
</html>
