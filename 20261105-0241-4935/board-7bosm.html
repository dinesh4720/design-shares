<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Status glyph / Replaced</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      .status-glyph-replaced {
        position: relative;
        width: 16px;
        height: 16px;
      }

      .status-glyph-replaced__ring {
        position: absolute;
        left: 0;
        top: 0;
        width: 16px;
        height: 16px;
      }

      .status-glyph-replaced__arrow {
        position: absolute;
        left: 0;
        top: 0;
        width: 16px;
        height: 16px;
      }
    </style>
  </head>
  <body>
    <div class="status-glyph-replaced" data-component="status-glyph-replaced">
      <svg class="status-glyph-replaced__ring" viewBox="0 0 16 16" preserveAspectRatio="none" overflow="visible" aria-hidden="true"><path d="M8 1.75 A6.25 6.25 0 1 1 8 14.25 A6.25 6.25 0 1 1 8 1.75 Z" fill="none" stroke="#8a6ad8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
      <svg class="status-glyph-replaced__arrow" viewBox="0 0 16 16" preserveAspectRatio="none" overflow="visible" aria-hidden="true"><path d="M5 8 H10.6 M8.4 5.8 L10.6 8 L8.4 10.2" fill="none" stroke="#8a6ad8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
    </div>
  </body>
</html>
