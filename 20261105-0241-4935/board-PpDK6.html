<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Button / Agent inbox</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: var(--raised);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --text-xs: 12px;
        --text-s: 13px;
        --space-xs: 8px;
        --space-s: 12px;
        --radius-m: 8px;
        --radius-full: 999px;
        --icon-s: 16px;
      }

      :root, [data-mode] {
        --raised: #ffffff;
        --line: #e5e4e3;
        --ink: #23221e;
        --muted: #646462;
        --primary: #23221e;
        --on-primary: #ffffff;
      }

      [data-mode="dark"] {
        --raised: #262521;
        --line: #34332e;
        --ink: #f2f1ed;
        --muted: #a8a7a1;
        --primary: #f2f1ed;
        --on-primary: #1b1a17;
      }

      .button-agent-inbox {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        padding: 0 var(--space-xs) 0 var(--space-s);
        width: fit-content;
        height: 32px;
        background-color: var(--raised);
        border-radius: var(--radius-m);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .button-agent-inbox__inbox-icon {
        width: var(--icon-s);
        height: var(--icon-s);
        color: var(--muted);
        stroke-width: 1.5;
      }

      .button-agent-inbox__label {
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-s);
        font-weight: 500;
        line-height: 1.2;
        white-space: pre;
      }

      .button-agent-inbox__count {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0 var(--space-xs);
        height: 20px;
        background-color: var(--primary);
        border-radius: var(--radius-full);
      }

      .button-agent-inbox__number {
        color: var(--on-primary);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-xs);
        font-weight: 500;
        line-height: 1.2;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <button class="button-agent-inbox" type="button" data-component="button-agent-inbox">
      <svg class="button-agent-inbox__inbox-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      <span class="button-agent-inbox__label">Agent inbox</span>
      <span class="button-agent-inbox__count">
        <span class="button-agent-inbox__number">3</span>
      </span>
    </button>
  </body>
</html>
