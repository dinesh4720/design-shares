<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Decision card</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: var(--raised);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --text-xs: 12px;
        --text-m: 14px;
        --space-2xs: 4px;
        --space-xs: 8px;
        --space-s: 12px;
        --radius-s: 6px;
        --radius-m: 8px;
        --icon-s: 16px;
      }

      :root, [data-mode] {
        --sunken: #f7f6f4;
        --raised: #ffffff;
        --line: #e5e4e3;
        --ink: #23221e;
        --muted: #646462;
      }

      [data-mode="dark"] {
        --sunken: #161513;
        --raised: #262521;
        --line: #34332e;
        --ink: #f2f1ed;
        --muted: #a8a7a1;
      }

      .decision-card {
        display: flex;
        align-items: stretch;
        width: 320px;
        background-color: var(--raised);
        border-radius: var(--radius-m);
        box-shadow: inset 0 0 0 1px var(--line);
        overflow: hidden;
      }

      .decision-card__needs-you-edge {
        width: 3px;
        flex-shrink: 0;
        background-color: var(--raised);
      }

      .decision-card__body {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-xs);
        padding: var(--space-s);
        flex: 1 1 0;
        min-width: 0;
      }

      .decision-card__meta {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        align-self: stretch;
      }

      .status-glyph-proposed {
        position: relative;
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .status-glyph-proposed__dashed-ring {
        position: absolute;
        left: 0;
        top: 0;
        width: 16px;
        height: 16px;
      }

      .decision-card__card-id {
        flex-shrink: 0;
        color: var(--muted);
        font-family: Menlo, Consolas, 'DejaVu Sans Mono', monospace;
        font-size: var(--text-xs);
        line-height: 1.3;
        white-space: pre;
      }

      .area-tag {
        display: flex;
        align-items: center;
        padding: var(--space-2xs) var(--space-xs);
        flex-shrink: 0;
        background-color: var(--sunken);
        border-radius: var(--radius-s);
      }

      .area-tag__area {
        color: var(--muted);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-xs);
        font-weight: 500;
        line-height: 1.3;
        white-space: pre;
      }

      .decision-card__card-age {
        flex: 1 1 0;
        min-width: 0;
        color: var(--muted);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-xs);
        line-height: 1.3;
        text-align: right;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }

      .decision-card__card-title {
        align-self: stretch;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-m);
        font-weight: 500;
        line-height: 1.4;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }

      .decision-card__card-footer {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        align-self: stretch;
      }

      .notes-count {
        display: flex;
        align-items: center;
        gap: var(--space-2xs);
        flex-shrink: 0;
      }

      .notes-count__chat-icon {
        width: var(--icon-s);
        height: var(--icon-s);
        color: var(--muted);
        stroke-width: 1.5;
      }

      .notes-count__count {
        color: var(--muted);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-xs);
        font-weight: 500;
        line-height: 1.3;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div class="decision-card" data-component="decision-card">
      <div class="decision-card__needs-you-edge"></div>
      <div class="decision-card__body">
        <div class="decision-card__meta">
          <div class="status-glyph-proposed" data-instance-of="status-glyph-proposed">
            <svg class="status-glyph-proposed__dashed-ring" viewBox="0 0 16 16" preserveAspectRatio="none" overflow="visible" aria-hidden="true"><path d="M8.65 1.78 A6.25 6.25 0 0 1 11.93 3.14 M12.86 4.07 A6.25 6.25 0 0 1 14.22 7.35 M14.22 8.65 A6.25 6.25 0 0 1 12.86 11.93 M11.93 12.86 A6.25 6.25 0 0 1 8.65 14.22 M7.35 14.22 A6.25 6.25 0 0 1 4.07 12.86 M3.14 11.93 A6.25 6.25 0 0 1 1.78 8.65 M1.78 7.35 A6.25 6.25 0 0 1 3.14 4.07 M4.07 3.14 A6.25 6.25 0 0 1 7.35 1.78" fill="none" stroke="#3f72e0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
          </div>
          <p class="decision-card__card-id">D-024</p>
          <div class="area-tag" data-instance-of="area-tag">
            <p class="area-tag__area">caching</p>
          </div>
          <p class="decision-card__card-age">12 min ago</p>
        </div>
        <h1 class="decision-card__card-title">Log doctors out after 15 minutes idle</h1>
        <div class="decision-card__card-footer">
          <div class="notes-count" data-instance-of="notes-count">
            <svg class="notes-count__chat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/></svg>
            <p class="notes-count__count">2</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
