<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flow box / Step · New</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: var(--highlight);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --text-xs: 12px;
        --text-m: 14px;
        --space-xs: 8px;
        --space-s: 12px;
        --radius-m: 8px;
        --radius-full: 999px;
      }

      :root, [data-mode] {
        --ink: #23221e;
        --highlight: #fef9c3;
        --highlight-line: #d9bd2b;
        --highlight-ink: #6b5600;
      }

      [data-mode="dark"] {
        --ink: #f2f1ed;
        --highlight: #3b3517;
        --highlight-line: #8f7a1f;
        --highlight-ink: #f3dc6a;
      }

      .flow-box-step-new {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-xs);
        padding: var(--space-s);
        width: 200px;
        background-color: var(--highlight);
        border-radius: var(--radius-m);
        box-shadow: inset 0 0 0 1px var(--highlight-line);
      }

      .flow-box-step-new__new-row {
        display: flex;
        align-items: flex-start;
      }

      .new-tag {
        display: flex;
        align-items: center;
        padding: 0 var(--space-xs);
        background-color: var(--highlight-ink);
        border-radius: var(--radius-full);
      }

      .new-tag__label {
        color: var(--highlight);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-xs);
        font-weight: 500;
        line-height: 1.4;
        white-space: pre;
      }

      .flow-box-step-new__box-content {
        display: flex;
        align-items: flex-start;
        gap: var(--space-xs);
        align-self: stretch;
      }

      .flow-box-step-new__box-text {
        flex: 1 1 0;
        min-width: 0;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--text-m);
        font-weight: 500;
        line-height: 1.4;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <div class="flow-box-step-new" data-component="flow-box-step-new" data-instance-of="flow-box-step">
      <div class="flow-box-step-new__new-row">
        <div class="new-tag" data-instance-of="new-tag">
          <p class="new-tag__label">New</p>
        </div>
      </div>
      <div class="flow-box-step-new__box-content">
        <p class="flow-box-step-new__box-text">Fetch from the EHR, about 400 ms</p>
      </div>
    </div>
  </body>
</html>
