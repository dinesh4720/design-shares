<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Radio / On</title>
    <style>
      body {
        margin: 0;
        background: var(--colorNeutralBackground1);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --colorNeutralBackground1: #ffffff;
        --colorBrandBackground: #0f6cbd;
        --colorBrandStroke1: #0f6cbd;
      }

      .radio-on {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 16px;
        height: 16px;
        background-color: var(--colorNeutralBackground1);
        border-radius: 8px;
        box-shadow: inset 0 0 0 1px var(--colorBrandStroke1);
      }

      .radio-on__dot {
        width: 8px;
        height: 8px;
        flex-shrink: 0;
        background-color: var(--colorBrandBackground);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="radio-on" data-component="radio-on">
      <div class="radio-on__dot"></div>
    </div>
  </body>
</html>
