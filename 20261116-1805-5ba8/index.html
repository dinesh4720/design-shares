<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Untitled 2 · snapshot</title>
<style>
  :root { color-scheme: light dark; --bg: #f0f0f0; --panel: #fff; --line: #e6e6e6; --text: #1a1a1a; --muted: #6b6b6b; --accent: #0763c8; --on: #e8e8e8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101010; --panel: #1e1e1e; --line: #2c2c2c; --text: #ececec; --muted: #a1a1a1; --accent: #80b5f7; --on: #363636; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  header { display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
  header svg { flex: none; }
  .words { display: grid; min-width: 0; line-height: 1.2; }
  .words strong { font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .words span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: flex; gap: 2px; margin-left: auto; padding: 3px; border-radius: 10px; background: var(--bg); }
  .seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font: inherit; font-weight: 500; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
  .seg button:disabled { opacity: .45; cursor: default; }
  a.open { color: var(--accent); text-decoration: none; font-weight: 500; font-size: 12.5px; white-space: nowrap; }
  a.open:hover { text-decoration: underline; }
  main { flex: 1; min-height: 0; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  iframe[hidden] { display: none; }
  .none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .pbar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 10px; background: var(--panel); box-shadow: 0 0 0 1px var(--line), 0 6px 20px rgba(0,0,0,.14); max-width: calc(100% - 24px); }
  .pbar[hidden] { display: none; }
  .pbar button, .pbar select { height: 28px; min-width: 28px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; color: var(--text); font: inherit; font-weight: 500; cursor: pointer; }
  .pbar button:hover, .pbar select:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
  .pbar #prev, .pbar #next { font-size: 18px; line-height: 1; }
  .pbar select { max-width: 220px; text-overflow: ellipsis; }
  .pbar .sep { width: 1px; height: 18px; margin: 0 2px; background: var(--line); }
  .talk { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; font-weight: 500; cursor: pointer; }
  .talk[aria-pressed="true"] { background: var(--text); color: var(--panel); }
  .talk .n:empty { display: none; }
  .talk .n { min-width: 16px; padding: 0 4px; border-radius: 8px; background: color-mix(in srgb, currentColor 14%, transparent); font-size: 11px; text-align: center; }
</style>
</head>

<header>
  <svg viewBox="0 0 48 48" width="22" height="22" fill="none" aria-hidden="true"><rect width="48" height="48" rx="11" fill="#15161c"/><path d="M24 14c-7 0-12 5-12 11s5 11 12 11 12-5 12-11-5-11-12-11zm0 5c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6 2.7-6 6-6z" fill="rgba(255,255,255,.18)"/><circle cx="24" cy="25" r="8.5" stroke="rgba(255,255,255,.55)" stroke-width="2.2"/><circle cx="31" cy="18" r="2.2" fill="#fff"/></svg>
  <div class="words"><strong>Untitled 2</strong><span>Surya · 32 boards · 16 Nov 2026, 18:05</span></div>
  <div class="seg" role="group" aria-label="View">
    <button type="button" data-view="design" aria-pressed="true">Canvas</button>
    <button type="button" data-view="prototype" aria-pressed="false">Prototype</button>
  </div>
  <button type="button" class="talk" id="talk" title="Comment (C)" aria-pressed="false"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>Comment</span><span class="n" id="talk-n"></span></button>
  
  <a class="open" id="open" href="canvas.html" target="_blank" rel="noopener">Open full size ↗</a>
</header>
<main>
  <iframe id="design" src="canvas.html" title="Canvas"></iframe>
  <iframe id="prototype" title="Prototype" allow="autoplay; fullscreen" hidden></iframe>
  <div class="pbar" id="pbar" role="group" aria-label="Frames" hidden>
    <button type="button" id="prev" title="Previous frame (←)" aria-label="Previous frame">‹</button>
    <select id="frame" aria-label="Frame"><option value="0">Create detail page · Add custom field</option><option value="1">Scheme definition · Prototype</option></select>
    <button type="button" id="next" title="Next frame (→)" aria-label="Next frame">›</button>
    <span class="sep"></span>
    <button type="button" id="restart" title="Restart (R)">Restart</button>
  </div>
</main>
<script type="application/json" id="frames">[{"id":"wYR6Q","name":"Create detail page · Add custom field","href":"prototype/index.html#/create-detail-page-add-custom-field"},{"id":"tQyF9","name":"Scheme definition · Prototype","href":"prototype/index.html#/scheme-definition-prototype"}]</script>
<script>
  (function () {
    var buttons = document.querySelectorAll(".seg button");
    var open = document.getElementById("open");
    var design = document.getElementById("design"), proto = document.getElementById("prototype");
    var frames = JSON.parse(document.getElementById("frames").textContent);
    var pbar = document.getElementById("pbar"), pick = document.getElementById("frame");
    var V = "";
    var at = 0, view = "design";
    function indexOf(id) { for (var i = 0; i < frames.length; i++) if (frames[i].id === id) return i; return -1; }
    function href(i) {
      if (!frames.length) return "prototype/index.html" + V;
      var h = frames[i].href, hash = h.indexOf("#");
      return hash < 0 ? h + V : h.slice(0, hash) + V + h.slice(hash);
    }
    function mark(hash) { try { history.replaceState(null, "", hash); } catch (e) {} }
    // The prototype from frame i (the first, or where it is).
    function play(i, again) {
      if (!proto) return;
      if (i !== undefined) at = Math.max(0, Math.min(frames.length - 1, i));
      var src = href(at);
      if (again || proto.dataset.src !== src) { proto.dataset.src = src; proto.src = src; }
      if (pick) pick.value = String(at);
      show("prototype");
    }
    function show(next) {
      view = next;
      for (var i = 0; i < buttons.length; i++) buttons[i].setAttribute("aria-pressed", String(buttons[i].dataset.view === view));
      design.hidden = view !== "design";
      if (proto) {
        proto.hidden = view !== "prototype";
        if (view === "prototype" && !proto.dataset.src) return play(at);
      }
      if (pbar) pbar.hidden = view !== "prototype";
      open.href = view === "prototype" ? href(at) : "canvas.html";
      mark(view === "prototype" ? (frames.length ? "#prototype/" + encodeURIComponent(frames[at].id) : "#prototype") : focused ? "#frame/" + encodeURIComponent(focused) : "#design");
    }
    var focused = "";
    for (var i = 0; i < buttons.length; i++) buttons[i].addEventListener("click", function () { if (!this.disabled) show(this.dataset.view); });
    if (pick) {
      pick.addEventListener("change", function () { play(Number(pick.value)); });
      document.getElementById("prev").onclick = function () { play(at - 1); };
      document.getElementById("next").onclick = function () { play(at + 1); };
      document.getElementById("restart").onclick = function () { play(at, true); };
    }
    // ← → and R move between frames, from here or from inside the prototype.
    function keys(e) {
      if (view !== "prototype" || !frames.length || e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || "")) return;
      if (e.key === "ArrowRight") { e.preventDefault(); play(at + 1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); play(at - 1); }
      else if (e.key === "r" || e.key === "R") play(at, true);
    }
    addEventListener("keydown", keys);
    if (proto) proto.addEventListener("load", function () {
      try {
        var w = proto.contentWindow;
        w.addEventListener("keydown", keys);
        // Followed a link in the prototype: the list says where it is now.
        var path = w.location.pathname.split("/").pop();
        for (var i = 0; i < frames.length; i++) if (frames[i].href.split("#")[0].split("/").pop() === path && frames[i].href.indexOf("#") < 0) { at = i; if (pick) pick.value = String(i); mark("#prototype/" + encodeURIComponent(frames[i].id)); break; }
        w.focus();
      } catch (e) {}
    });
    // Where the link points: #prototype[/<frame>], #frame/<frame> (that
    // frame alone on the canvas), or the canvas.
    var hash = location.hash.slice(1), slash = hash.indexOf("/");
    var kind = slash < 0 ? hash : hash.slice(0, slash), target = slash < 0 ? "" : decodeURIComponent(hash.slice(slash + 1));
    if (kind === "frame" && target && true) {
      focused = target;
      design.src = "canvas.html#frame=" + encodeURIComponent(target);
      if (indexOf(target) >= 0) at = indexOf(target);
      show("design");
    } else if (kind === "prototype" && proto) play(Math.max(0, indexOf(target)));
    // The canvas asks: play a frame, or it's showing every frame again.
    addEventListener("message", function (e) {
      if (!e.data || e.source !== design.contentWindow) return;
      if (e.data.knot === "play" && proto) { var i = indexOf(e.data.id); play(i < 0 ? 0 : i); }
      if (e.data.knot === "frame") { focused = e.data.id || ""; if (view === "design") show("design"); }
    });
    // Comments live on the canvas (comments.js there): C or the button.
    var talk = document.getElementById("talk");
    if (talk) {
      var comment = function () {
        show("design");
        var w = design.contentWindow;
        try { if (w.knotComment) w.knotComment(); w.focus(); } catch (e) {}
      };
      talk.addEventListener("click", comment);
      addEventListener("keydown", function (e) {
        if ((e.key === "c" || e.key === "C") && view === "design" && !e.metaKey && !e.ctrlKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { e.preventDefault(); comment(); }
      });
      addEventListener("message", function (e) {
        if (!e.data || e.data.knot !== "comments") return;
        talk.setAttribute("aria-pressed", String(Boolean(e.data.mode)));
        document.getElementById("talk-n").textContent = e.data.count ? String(e.data.count) : "";
      });
    }
  })();
</script>
