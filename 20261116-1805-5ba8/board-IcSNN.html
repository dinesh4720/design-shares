      body {
        margin: 0;
        background: var(--colorNeutralBackground3);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --colorNeutralForeground1: #242424;
        --colorNeutralForeground3: #616161;
        --colorNeutralBackground3: #f5f5f5;
        --colorNeutralBackground6: #e6e6e6;
        --colorNeutralStroke3: #f0f0f0;
        --borderRadiusLarge: 6px;
        --fontSizeBase200: 12px;
        --fontSizeBase300: 14px;
        --fontWeightSemibold: 600;
        --fontWeightRegular: 400;
      }

      .engagement-subnav {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 200px;
        height: 712px;
        background-color: var(--colorNeutralBackground3);
        box-shadow: inset -1px 0 0 0 var(--colorNeutralStroke3);
      }

      .engagement-subnav__subnav-title-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 8px 0 16px;
        height: 40px;
        flex-shrink: 0;
        align-self: stretch;
      }

      .engagement-subnav__title {
        flex-shrink: 0;
        color: var(--colorNeutralForeground3);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--fontSizeBase300);
        font-weight: var(--fontWeightSemibold);
        line-height: 1.4;
        white-space: pre;
      }

      .engagement-subnav__collapse-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        color: var(--colorNeutralForeground3);
        stroke-width: 1.5;
      }

      .engagement-subnav__nav-items {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        padding: 0 10px 10px;
        flex-shrink: 0;
        align-self: stretch;
      }

      .engagement-subnav__nav-item-requests {
        display: flex;
        align-items: center;
        padding: 0 8px 0 14px;
        height: 32px;
        align-self: stretch;
        background-color: var(--colorNeutralBackground6);
        border-radius: var(--borderRadiusLarge);
      }

      .engagement-subnav__label {
        flex-shrink: 0;
        color: var(--colorNeutralForeground1);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--fontSizeBase200);
        font-weight: var(--fontWeightSemibold);
