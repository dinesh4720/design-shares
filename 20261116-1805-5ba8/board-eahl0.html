<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Avatar / Initials</title>
    <style>
      /* The fonts ship beside the page (assets/fonts/), so text looks the same on every system. */

      /* Segoe UI from Google Fonts, under the SIL Open Font License or Apache License 2.0, https://fonts.google.com */

      @font-face {
        font-family: 'Segoe UI';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: local('Segoe UI'), url("assets/fonts/segoe-ui-600-figma.ttf") format("truetype");
        ascent-override: 107.91%;
        descent-override: 25.1%;
        line-gap-override: 0%;
      }

      body {
        margin: 0;
        background: var(--colorNeutralBackground6);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --colorNeutralForeground2: #424242;
        --colorNeutralBackground6: #e6e6e6;
        --borderRadiusCircular: 9999px;
        --fontSizeBase100: 10px;
      }

      .avatar-initials {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 20px;
        height: 20px;
        background-color: var(--colorNeutralBackground6);
        border-radius: var(--borderRadiusCircular);
      }

      .avatar-initials__initials {
        flex-shrink: 0;
        color: var(--colorNeutralForeground2);
        font-family: 'Segoe UI', 'Selawik', sans-serif;
        font-size: var(--fontSizeBase100);
        font-weight: 600;
        line-height: 1;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div class="avatar-initials" data-component="avatar-initials">
      <p class="avatar-initials__initials">JS</p>
    </div>
  </body>
</html>
