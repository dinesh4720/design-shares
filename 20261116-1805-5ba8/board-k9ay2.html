<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Button / Secondary</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: var(--colorNeutralBackground1);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --colorNeutralForeground1: #242424;
        --colorNeutralBackground1: #ffffff;
        --colorNeutralStroke1: #d1d1d1;
        --borderRadiusMedium: 4px;
        --fontSizeBase300: 14px;
      }

      .button-secondary {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        width: fit-content;
        height: 32px;
        background-color: var(--colorNeutralBackground1);
        border-radius: var(--borderRadiusMedium);
        box-shadow: inset 0 0 0 1px var(--colorNeutralStroke1);
      }

      .button-secondary__leading-icon {
        width: 16px;
        height: 16px;
        color: var(--colorNeutralForeground1);
        stroke-width: 1.5;
      }

      .button-secondary__label {
        color: var(--colorNeutralForeground1);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--fontSizeBase300);
        font-weight: 600;
        line-height: 1.429;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <button class="button-secondary" type="button" data-component="button-secondary">
      <svg class="button-secondary__leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      <span class="button-secondary__label">Secondary</span>
    </button>
  </body>
</html>
