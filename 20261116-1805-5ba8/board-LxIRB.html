<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>App header</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: var(--colorNeutralBackground2);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --colorNeutralForeground1: #242424;
        --colorNeutralForeground2: #424242;
        --colorNeutralBackground2: #fafafa;
        --colorNeutralStroke2: #e0e0e0;
        --borderRadiusMedium: 4px;
        --fontSizeBase400: 16px;
      }

      .app-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px 0 16px;
        width: 1366px;
        height: 48px;
        background-color: var(--colorNeutralBackground2);
        box-shadow: inset 0 -1px 0 0 var(--colorNeutralStroke2);
      }

      .app-header__surya-logo {
        position: relative;
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        overflow: hidden;
      }

      .app-header__logo-crop {
        position: absolute;
        left: -15px;
        top: -9px;
        width: 870px;
        height: 438px;
        object-fit: cover;
      }

      .app-header__surya {
        flex-shrink: 0;
        color: var(--colorNeutralForeground1);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--fontSizeBase400);
        font-weight: 600;
        line-height: 1.3;
        white-space: pre;
      }

      .app-header__spacer {
        height: 1px;
        flex: 1 1 0;
        min-width: 0;
      }

      .app-header__header-actions {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }

      .button-subtle-icon {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 32px;
        height: 32px;
        border-radius: var(--borderRadiusMedium);
      }

      .button-subtle-icon__glyph {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        color: var(--colorNeutralForeground2);
        stroke-width: 1.5;
      }
    </style>
  </head>
  <body>
    <header class="app-header" data-component="app-header">
      <div class="app-header__surya-logo">
        <img class="app-header__logo-crop" src="assets/image.png" alt="Logo crop">
      </div>
      <p class="app-header__surya">Surya</p>
      <div class="app-header__spacer"></div>
      <header class="app-header__header-actions">
        <button class="button-subtle-icon" type="button" data-instance-of="button-subtle-icon">
          <svg class="button-subtle-icon__glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
        </button>
        <button class="button-subtle-icon" type="button" data-instance-of="button-subtle-icon">
          <svg class="button-subtle-icon__glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        </button>
        <button class="button-subtle-icon" type="button" data-instance-of="button-subtle-icon">
          <svg class="button-subtle-icon__glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </header>
    </header>
  </body>
</html>
