  .focus strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  .bar { position: fixed; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 10px; background: var(--panel); box-shadow: 0 0 0 1px var(--line), 0 4px 16px rgba(0,0,0,.08); cursor: default; }

  #pct { min-width: 48px; font-variant-numeric: tabular-nums; }

  #pins { position: absolute; inset: 0; pointer-events: none; }
  .c-pin { position: absolute; width: 28px; height: 28px; margin: -28px 0 0 0; padding: 0; border: 2px solid #fff; border-radius: 14px 14px 14px 2px; background: #1a1a1a; color: #fff; font: 600 12px/24px -apple-system, BlinkMacSystemFont, "Inter", sans-serif; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.25); cursor: pointer; pointer-events: auto; transition: transform .15s; transform-origin: 0 100%; }
  .c-pin:hover, .c-pin.open { transform: scale(1.12); }
  .c-pin.draft { background: #0d6efd; pointer-events: none; }
  .c-card { position: fixed; z-index: 5; width: 280px; max-width: calc(100vw - 16px); padding: 10px; border-radius: 12px; background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--line), 0 8px 28px rgba(0,0,0,.16); cursor: default; user-select: text; -webkit-user-select: text; }

  .c-head { display: flex; align-items: center; justify-content: space-between; margin: -2px 0 6px; font-size: 13px; }
  .c-x { width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 16px; cursor: pointer; }
  .c-x:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
  .c-list { list-style: none; margin: 0 0 8px; padding: 0; max-height: 260px; overflow: auto; }
  .c-msg { padding: 6px 0; border-top: 1px solid var(--line); }
  .c-msg:first-child { border-top: 0; }
  .c-meta { display: flex; gap: 6px; align-items: baseline; }
  .c-who { font-weight: 600; font-size: 12px; }
  .c-msg.owner .c-who::after { content: " · designer"; font-weight: 400; color: var(--muted); }
  .c-when { color: var(--muted); font-size: 11px; }
  .c-words { margin: 2px 0 0; font-size: 13px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
  .c-form { display: grid; gap: 6px; }
  .c-name, .c-text { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--text); font: 13px/1.4 inherit; font-family: inherit; resize: none; outline: none; }
  .c-name:focus, .c-text:focus { border-color: var(--muted); }
  .c-row { display: flex; align-items: center; gap: 8px; }
  .c-err { flex: 1; color: #d33; font-size: 11px; }
  .c-send { height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: var(--text); color: var(--panel); font: 500 12px inherit; font-family: inherit; cursor: pointer; }
  .c-send:disabled { opacity: .4; cursor: default; }
  .c-hint { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); padding: 6px 12px; border-radius: 8px; background: #1a1a1a; color: #fff; font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div id="world"></div>
<div class="bar pages" id="pagebar" hidden><select id="page" aria-label="Page"></select></div>
<div class="bar focus" id="focusbar" hidden><strong id="focusname"></strong><button type="button" id="all">Show all frames</button></div>
<div class="bar zoom" role="group" aria-label="Zoom">
  <button type="button" id="out" aria-label="Zoom out">−</button>
  <button type="button" id="pct" title="Zoom to 100%">100%</button>
  <button type="button" id="in" aria-label="Zoom in">+</button>
  <button type="button" id="fit" title="See everything (F)">Fit</button>
</div>

<script>
(function () {
  var pages = JSON.parse(document.getElementById("pages").textContent);
  var world = document.getElementById("world");
  var pct = document.getElementById("pct");
  var view = { s: 1, x: 0, y: 0 };
  var current = 0;
  var MIN = 0.02, MAX = 8;
  // For comments.js (share comments): the view, the pages, which is shown.
  var hooks = window.knotCanvas = { view: view, pages: pages, current: function () { return current; }, mode: "", only: "" };
  // In the snapshot's viewer, a frame's ▷ plays it in the prototype there.
  var inViewer = window.parent !== window;
  if (inViewer) document.body.classList.add("playable");
  function apply() {
    world.style.transform = "translate(" + view.x + "px," + view.y + "px) scale(" + view.s + ")";
    world.style.setProperty("--inv", String(1 / view.s));
    pct.textContent = Math.round(view.s * 100) + "%";
    if (hooks.onView) hooks.onView();
  }
  function zoomAt(s, cx, cy) {
    moved = true;
    s = Math.min(MAX, Math.max(MIN, s));
    view.x = cx - (cx - view.x) * (s / view.s);
    view.y = cy - (cy - view.y) * (s / view.s);
    view.s = s;
    apply();
  }
  // Until someone moves the view, it keeps everything in sight (the frame
  // this shows in can have no size yet when it starts).
  var moved = false;
  function fit() {
    if (innerWidth < 40 || innerHeight < 40) return requestAnimationFrame(fit);
    var boards = pages[current].boards.filter(function (b) { return !hooks.only || b.id === hooks.only; });
    if (!boards.length) boards = pages[current].boards;
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    boards.forEach(function (b) { x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); });
    var pad = 64, w = innerWidth - pad * 2, h = innerHeight - pad * 2;
    var s = Math.min(1, w / (x1 - x0), h / (y1 - y0));
    view.s = Math.max(MIN, s);
    view.x = (innerWidth - (x1 - x0) * view.s) / 2 - x0 * view.s;
    view.y = (innerHeight - (y1 - y0) * view.s) / 2 - y0 * view.s;
    apply();
  }
  function show(i) {
    current = i;
    var page = pages[i];
    document.body.style.setProperty("--page", page.color || "");
    if (!page.color) document.body.style.removeProperty("--page");
    world.textContent = "";
    page.boards.forEach(function (b) {
      if (hooks.only && b.id !== hooks.only) return;
      var box = document.createElement("div");
      box.className = "board";
      box.style.left = b.x + "px"; box.style.top = b.y + "px";
      box.style.width = b.w + "px"; box.style.height = b.h + "px";
      box.style.setProperty("--w", String(b.w));
      box.dataset.file = b.file;
      var name = document.createElement("div");
      name.className = "name";
      var label = document.createElement("span");
      label.textContent = b.name;
      name.appendChild(label);
      if (b.id) {
        var play = document.createElement("button");
        play.type = "button";
        play.className = "play";
        play.textContent = "▶";
        play.title = "Play this frame";
        play.setAttribute("aria-label", "Play " + (b.name || "this frame"));
        play.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
        play.addEventListener("click", function (e) { e.stopPropagation(); window.parent.postMessage({ knot: "play", id: b.id }, "*"); });
        name.appendChild(play);
      }
      var frame = document.createElement("iframe");
      frame.src = b.file;
      frame.title = b.name || "Board";
      frame.setAttribute("tabindex", "-1");
      box.appendChild(name);
      box.appendChild(frame);
      world.appendChild(box);
    });

  }
  // Moving around: drag (one finger), pinch (two), scroll and ⌘/Ctrl-scroll.
  var pointers = new Map(), last, press;
  addEventListener("pointerdown", function (e) {
    if (e.target.closest(".bar, .c-card, .c-pin")) return;
    press = pointers.size ? undefined : { id: e.pointerId, x: e.clientX, y: e.clientY };
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    document.body.setPointerCapture(e.pointerId);
    document.body.classList.add("dragging");
    last = undefined;
  });
  addEventListener("pointermove", function (e) {
    if (!pointers.has(e.pointerId)) return;
    var before = pointers.get(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      moved = true; view.x += e.clientX - before.x; view.y += e.clientY - before.y; apply();
    } else if (pointers.size === 2) {
      var p = Array.from(pointers.values());
      var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
      if (last) { view.x += mx - last.mx; view.y += my - last.my; zoomAt(view.s * d / last.d, mx, my); }
      last = { d: d, mx: mx, my: my };
    }
  });
  function up(e) { pointers.delete(e.pointerId); last = undefined; if (!pointers.size) document.body.classList.remove("dragging"); }
  // A press that didn't move: a comment there in comment mode (comments.js).
  addEventListener("pointerup", function (e) {
    var p = press;
    press = undefined;
    if (!p || p.id !== e.pointerId || Math.hypot(e.clientX - p.x, e.clientY - p.y) > 4) return;
    if (hooks.mode === "comment" && hooks.onPlace) hooks.onPlace(e);
    else if (hooks.onClick) hooks.onClick(e);
  });
  addEventListener("pointerup", up);
  addEventListener("pointercancel", up);
  addEventListener("wheel", function (e) {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) zoomAt(view.s * Math.exp(-e.deltaY * (e.ctrlKey && !e.metaKey ? 0.01 : 0.002)), e.clientX, e.clientY);
    else { moved = true; view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
  }, { passive: false });
  addEventListener("dblclick", function (e) {
    var box = e.target.closest && e.target.closest(".board");
    if (box) window.open(box.dataset.file, "_blank", "noopener");
  });
  function centre(s) { zoomAt(s, innerWidth / 2, innerHeight / 2); }
  document.getElementById("in").onclick = function () { centre(view.s * 1.25); };
  document.getElementById("out").onclick = function () { centre(view.s / 1.25); };
  document.getElementById("pct").onclick = function () { centre(1); };
  document.getElementById("fit").onclick = function () { fit(); moved = false; };
  addEventListener("keydown", function (e) {
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === "+" || e.key === "=") centre(view.s * 1.25);
    else if (e.key === "-" || e.key === "_") centre(view.s / 1.25);
    else if (e.key === "f" || e.key === "F" || (e.key === "1" && e.shiftKey)) fit();
    else if (e.key === "0") centre(1);
  });
  addEventListener("resize", function () { if (moved) apply(); else fit(); });
  // Pages, when there's more than one.
  var select = document.getElementById("page");
  pages.forEach(function (p, i) { var o = document.createElement("option"); o.value = String(i); o.textContent = p.name; select.appendChild(o); });
  if (pages.length > 1) document.getElementById("pagebar").hidden = false;
  select.onchange = function () { show(Number(select.value)); };
  // A link to one frame (#frame=<id>): that frame alone, until "Show all frames".
  var focusbar = document.getElementById("focusbar");
  function focus(id) {
    hooks.only = "";
    var found = -1, name = "";
    pages.forEach(function (p, i) { p.boards.forEach(function (b) { if (b.id === id && found < 0) { found = i; name = b.name; } }); });
    if (found >= 0) hooks.only = id;
    focusbar.hidden = !hooks.only;
    document.getElementById("pagebar").hidden = Boolean(hooks.only) || pages.length < 2;
    document.getElementById("focusname").textContent = name || "Frame";
    moved = false;
    select.value = String(Math.max(0, found));
    show(Math.max(0, found));
    if (inViewer) window.parent.postMessage({ knot: "frame", id: hooks.only }, "*");
  }
  document.getElementById("all").onclick = function () { focus(""); };
  var wanted = /^#frame=(.+)$/.exec(location.hash);
  if (wanted) focus(decodeURIComponent(wanted[1]));
  else show(0);
})();
</script>
