<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Button / Primary</title>
    <style>
      /* The fonts ship beside the page (assets/fonts/), so text looks the same on every system. */

      /* Segoe UI from Google Fonts, under the SIL Open Font License or Apache License 2.0, https://fonts.google.com */

      @font-face {
        font-family: 'Segoe UI';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: local('Segoe UI'), url("assets/fonts/segoe-ui-600-figma.ttf") format("truetype");
        ascent-override: 107.91%;
        descent-override: 25.1%;
        line-gap-override: 0%;
      }

      body {
        margin: 0;
        background: var(--colorBrandBackground);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --colorNeutralForegroundOnBrand: #ffffff;
        --colorBrandBackground: #0f6cbd;
        --borderRadiusMedium: 4px;
        --fontSizeBase300: 14px;
      }

      .button-primary {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        width: fit-content;
        height: 32px;
        background-color: var(--colorBrandBackground);
        border-radius: var(--borderRadiusMedium);
      }

      .button-primary__leading-icon {
        width: 16px;
        height: 16px;
        color: var(--colorNeutralForegroundOnBrand);
        stroke-width: 1.5;
      }

      .button-primary__label {
        color: var(--colorNeutralForegroundOnBrand);
        font-family: 'Segoe UI', 'Selawik', sans-serif;
        font-size: var(--fontSizeBase300);
        font-weight: 600;
        line-height: 1.429;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <button class="button-primary" type="button" data-component="button-primary">
      <svg class="button-primary__leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      <span class="button-primary__label">Primary</span>
    </button>
  </body>
</html>
