<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Badge / Draft</title>
    <style>
      /* Inter ships beside the page (assets/fonts/), so text looks the same on every system. */

      /* Inter by The Inter Project Authors, SIL Open Font License 1.1, https://openfontlicense.org */

      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
        background: var(--colorNeutralBackground3);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --colorNeutralForeground3: #616161;
        --colorNeutralBackground3: #f5f5f5;
        --colorNeutralStroke2: #e0e0e0;
        --borderRadiusMedium: 4px;
        --fontSizeBase200: 12px;
      }

      .badge-draft {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 6px;
        width: fit-content;
        height: 20px;
        background-color: var(--colorNeutralBackground3);
        border-radius: var(--borderRadiusMedium);
        box-shadow: inset 0 0 0 1px var(--colorNeutralStroke2);
      }

      .badge-draft__status-icon {
        position: relative;
        width: 12px;
        height: 12px;
      }

      .badge-draft__circle-1 {
        position: absolute;
        left: 1px;
        top: 1px;
        width: 10px;
        height: 10px;
      }

      .badge-draft__label {
        color: var(--colorNeutralForeground3);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: var(--fontSizeBase200);
        line-height: 1.333;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div class="badge-draft" data-component="badge-draft">
      <div class="badge-draft__status-icon">
        <svg class="badge-draft__circle-1" viewBox="1 1 10 10" preserveAspectRatio="none" overflow="visible" aria-hidden="true"><path d="M11 6 C11 8.761 8.761 11 6 11 C3.239 11 1 8.761 1 6 C1 3.239 3.239 1 6 1 C8.761 1 11 3.239 11 6 Z" fill="none" stroke="#616161" stroke-width="1" stroke-dasharray="3 2" stroke-linecap="butt" stroke-linejoin="miter" vector-effect="non-scaling-stroke"/></svg>
      </div>
      <p class="badge-draft__label">Draft</p>
    </div>
  </body>
</html>
