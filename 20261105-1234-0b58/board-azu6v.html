<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>References</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      .references {
        position: relative;
        width: 18084px;
        height: 4839px;
        background-color: #ffffff;
        box-shadow: inset 0 0 0 1px #e6e6e6;
      }

      .references__image {
        position: absolute;
        left: 684px;
        top: 1372px;
        width: 1200px;
        height: 1200px;
        object-fit: cover;
      }

      .references__image-2 {
        position: absolute;
        left: 1957px;
        top: 1372px;
        width: 1200px;
        height: 1371px;
        object-fit: cover;
      }

      .references__image-3 {
        position: absolute;
        left: 3230px;
        top: 1109px;
        width: 2531px;
        height: 1898px;
        object-fit: cover;
      }

      .references__image-4 {
        position: absolute;
        left: 5834px;
        top: 1372px;
        width: 1635px;
        height: 1635px;
        object-fit: cover;
      }

      .references__image-5 {
        position: absolute;
        left: 7542px;
        top: 1239px;
        width: 1768px;
        height: 1768px;
        object-fit: cover;
      }

      .references__image-6 {
        position: absolute;
        left: 9383px;
        top: 1239px;
        width: 2357px;
        height: 1768px;
        object-fit: cover;
      }

      .references__image-7 {
        position: absolute;
        left: 11810px;
        top: 1239px;
        width: 2289px;
        height: 1776px;
        object-fit: cover;
      }

      .references__image-8 {
        position: absolute;
        left: 14172px;
        top: 1239px;
        width: 3302px;
        height: 2477px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="references">
      <img class="references__image" src="assets/image.png" alt="image">
      <img class="references__image-2" src="assets/image-2.png" alt="image-2">
      <img class="references__image-3" src="assets/image-3.png" alt="image-3">
      <img class="references__image-4" src="assets/image-4.png" alt="image-4">
      <img class="references__image-5" src="assets/image-5.png" alt="image-5">
      <img class="references__image-6" src="assets/image-6.png" alt="image-6">
      <img class="references__image-7" src="assets/image-7.png" alt="image-7">
      <img class="references__image-8" src="assets/image-8.png" alt="image-8">
    </div>
  </body>
</html>
