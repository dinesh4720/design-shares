<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab</title>
    <style>
      /* The fonts ship beside the page (assets/fonts/), so text looks the same on every system. */

      /* Segoe UI from Google Fonts, under the SIL Open Font License or Apache License 2.0, https://fonts.google.com */

      @font-face {
        font-family: 'Segoe UI';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: local('Segoe UI'), url("assets/fonts/segoe-ui-600-figma.ttf") format("truetype");
        ascent-override: 107.91%;
        descent-override: 25.1%;
        line-gap-override: 0%;
      }

      body {
        margin: 0;
        background: var(--colorBrandBackground2);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --colorNeutralForegroundOnBrand: #ffffff;
        --colorBrandBackground: #0f6cbd;
        --colorBrandBackground2: #ebf3fc;
        --colorBrandForeground1: #0f6cbd;
        --colorBrandStroke1: #0f6cbd;
        --borderRadiusCircular: 9999px;
        --fontSizeBase100: 10px;
        --fontSizeBase300: 14px;
      }

      .tab {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px 0 10px;
        width: fit-content;
        height: 32px;
        background-color: var(--colorBrandBackground2);
        border-radius: var(--borderRadiusCircular);
        box-shadow: inset 0 0 0 1px var(--colorBrandStroke1);
      }

      .tab__tab-icon {
        width: 16px;
        height: 16px;
        color: var(--colorBrandForeground1);
        stroke-width: 1.5;
      }

      .tab__label {
        color: var(--colorBrandForeground1);
        font-family: 'Segoe UI', 'Selawik', sans-serif;
        font-size: var(--fontSizeBase300);
        font-weight: 600;
        line-height: 1.429;
        white-space: pre;
      }

      .counter-badge {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0 5px;
        height: 16px;
        background-color: var(--colorBrandBackground);
        border-radius: var(--borderRadiusCircular);
      }

      .counter-badge__count {
        color: var(--colorNeutralForegroundOnBrand);
        font-family: 'Segoe UI', 'Selawik', sans-serif;
        font-size: var(--fontSizeBase100);
        font-weight: 600;
        line-height: 1.4;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div class="tab" data-component="tab">
      <svg class="tab__tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
      <p class="tab__label">Forms</p>
      <div class="counter-badge" data-instance-of="counter-badge">
        <p class="counter-badge__count">1</p>
      </div>
    </div>
  </body>
</html>
