<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Badge / Published</title>
    <style>
      /* The fonts ship beside the page (assets/fonts/), so text looks the same on every system. */

      /* Segoe UI from Google Fonts, under the SIL Open Font License or Apache License 2.0, https://fonts.google.com */

      @font-face {
        font-family: 'Segoe UI';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: local('Segoe UI'), url("assets/fonts/segoe-ui-400-figma.ttf") format("truetype");
        ascent-override: 107.91%;
        descent-override: 25.1%;
        line-gap-override: 0%;
      }

      body {
        margin: 0;
        background: var(--colorStatusSuccessBackground1);
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-rendering: geometricPrecision;
      }

      body > * {
        margin-inline: auto;
      }

      *, ::before, ::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      p, h1, h2, h3, h4, h5, h6, blockquote, figure, dl, dd {
        margin: 0;
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: inherit;
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      ul, ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      img, svg {
        display: block;
      }

      /* Design tokens. Set data-* theme attributes on any element to switch its subtree. */
      :root {
        --colorStatusSuccessBackground1: #f1faf1;
        --colorStatusSuccessForeground1: #0e700e;
        --colorStatusSuccessBorder1: #9fd89f;
        --borderRadiusMedium: 4px;
        --fontSizeBase200: 12px;
      }

      .badge-published {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 6px;
        width: fit-content;
        height: 20px;
        background-color: var(--colorStatusSuccessBackground1);
        border-radius: var(--borderRadiusMedium);
        box-shadow: inset 0 0 0 1px var(--colorStatusSuccessBorder1);
      }

      .badge-published__status-icon {
        width: 12px;
        height: 12px;
        color: var(--colorStatusSuccessForeground1);
        stroke-width: 1.5;
      }

      .badge-published__label {
        color: var(--colorStatusSuccessForeground1);
        font-family: 'Segoe UI', 'Selawik', sans-serif;
        font-size: var(--fontSizeBase200);
        line-height: 1.333;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div class="badge-published" data-component="badge-published">
      <svg class="badge-published__status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></svg>
      <p class="badge-published__label">Published</p>
    </div>
  </body>
</html>
